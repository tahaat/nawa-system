<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نَسيج | نظام نوى للمتابعة والتقييم وتتبّع المشاريع</title>
<meta name="theme-color" content="#A21008">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script>try{var t=localStorage.getItem("nawa.theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="./app/style.css">
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-in"><img id="sp-logo" alt=""><div class="sp-name" id="sp-name"></div><div class="sp-sub" id="sp-sub"></div><div class="sp-line"></div></div></div>
<script>(function(){var d=document.getElementById("splash");try{var en=localStorage.getItem("nawa.lang")==="en";if(navigator.webdriver||sessionStorage.getItem("nawa.splash")||matchMedia("(prefers-reduced-motion: reduce)").matches){d.remove();return}sessionStorage.setItem("nawa.splash","1");document.getElementById("sp-name").textContent=en?"Naseej":"نَسيج";document.getElementById("sp-sub").textContent=en?"Nawa MEAL & Programme Tracking System":"نظام نوى للمتابعة والتقييم وتتبّع المشاريع";d.dir=en?"ltr":"rtl";var done=function(){if(d.parentNode){d.classList.add("out");setTimeout(function(){d.remove()},600)}};d.addEventListener("click",done);setTimeout(done,2500);window.__splash=d}catch(e){d.remove()}})()</script>
<aside id="side"><img class="logo" alt="نوى"><div id="brand" class="brand"></div><nav id="nav"></nav><div id="whoami" hidden></div><div id="sync" class="small"></div></aside>
<main><header id="top"></header><div id="view"></div></main>
<div id="toast"></div>
<script type="module" src="./app/main.js"></script>
</body></html>
