name: Deploy to Cloudflare (Naseej)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 993b5ff0b67088b1c01bc5d33f052149
    steps:
      - name: تخطّي إن لم يُضبط رمز Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN غير مضبوط؛ لا نشر على Cloudflare."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 22, cache: npm }
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm run build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@4 deploy
